# Legacy Compose configuration; VPS deployment is supported only via Swarm.
# For installation and migration, see docs/SERVER.md and docs/SWARM.md.
name: pawtalk-server
services:
  server:
    image: ${PAWTALK_IMAGE:?Set PAWTALK_IMAGE in .env to a published image version}
    network_mode: host
    environment:
      PAWTALK_PUBLIC_IP: ${PAWTALK_PUBLIC_IP:-}
      PAWTALK_PORT: ${PAWTALK_PORT:-18443}
      PAWTALK_E2EE: ${PAWTALK_E2EE:-false}
      PAWTALK_E2EE_KEY_ID: ${PAWTALK_E2EE_KEY_ID:-}
      PAWTALK_CHAT_MAX_MB: ${PAWTALK_CHAT_MAX_MB:-128}
      PAWTALK_UPDATE_PROXY: ${PAWTALK_UPDATE_PROXY:-true}
    volumes:
      - server_data:/data
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  server_data:
