name: Publish component release
on:
  push:
    tags: ['client-v*', 'server-v*', 'manager-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.route.outputs.component }}
      version: ${{ steps.route.outputs.version }}
      channel: ${{ steps.route.outputs.channel }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require tag commit contained in main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - id: route
        env:
          PAWTALK_CLIENT_CHANNEL: ${{ vars.PAWTALK_CLIENT_CHANNEL || 'preview' }}
          PAWTALK_SERVER_CHANNEL: ${{ vars.PAWTALK_SERVER_CHANNEL || 'preview' }}
          PAWTALK_MANAGER_CHANNEL: ${{ vars.PAWTALK_MANAGER_CHANNEL || 'preview' }}
        run: |
          node scripts/release-contract.mjs "$GITHUB_REF_NAME" > /tmp/route.json
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('/tmp/route.json')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'component='+p.component+'\nversion='+p.version+'\nchannel='+p.channel+'\n');"
      - name: Require reviewed component release notes
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ ! -s "$notes" ]; then
            echo "Missing release description: $notes (see docs/RELEASING.md)" >&2
            exit 1
          fi
      - name: Refuse replacing a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A non-404 API error must fail rather than imply the release is absent.
          code=$(curl -sS -o /tmp/existing.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          test "$code" = 404
  verify:
    needs: plan
    uses: ./.github/workflows/check.yml
    with:
      component: ${{ needs.plan.outputs.component }}
      client-prerelease: ${{ needs.plan.outputs.channel == 'preview' }}
    secrets:
      PAWTALK_UPDATE_PRIVATE_KEY: ${{ secrets.PAWTALK_UPDATE_PRIVATE_KEY }}
  prepare-server:
    if: needs.plan.outputs.component == 'server'
    needs: [plan, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-server-windows
          path: release/server
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Build complete multi-platform image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/standalone.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=release/server-image.tar
          labels: |
            org.opencontainers.image.source=https://github.com/IlyaRusskikh/PawTalk
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Sign prepared Server digest and Windows package
        env:
          PAWTALK_SERVER_PRIVATE_KEY: ${{ secrets.PAWTALK_SERVER_PRIVATE_KEY }}
          PAWTALK_PRERELEASE: ${{ needs.plan.outputs.channel == 'preview' && 'true' || 'false' }}
        run: |
          skopeo inspect --raw oci-archive:release/server-image.tar > /tmp/server-index.json
          digest=$(sha256sum /tmp/server-index.json | cut -d ' ' -f 1)
          export PAWTALK_IMAGE_DIGEST="sha256:$digest"
          node scripts/release-metadata.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: pawtalk-server-prepared
          if-no-files-found: error
          path: |
            release/server-image.tar
            release/server/server-manifest.json
            release/server/PawTalk.Server.*.windows-x64.zip
  prepare-manager:
    if: needs.plan.outputs.component == 'manager'
    needs: [plan, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-manager-windows
          path: release/manager
      - name: Sign complete Manager bundle
        env:
          PAWTALK_MANAGER_PRIVATE_KEY: ${{ secrets.PAWTALK_MANAGER_PRIVATE_KEY }}
          PAWTALK_PRERELEASE: ${{ needs.plan.outputs.channel == 'preview' && 'true' || 'false' }}
        run: node scripts/release-metadata.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: pawtalk-manager-prepared
          if-no-files-found: error
          path: release/manager/*
  client:
    environment: release-publish
    if: needs.plan.outputs.component == 'client'
    needs: [plan, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-windows
          path: release
      - name: Publish Client assets only
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          flags=(--latest=false)
          if [ "$CHANNEL" = preview ]; then flags=(--prerelease --latest=false); fi
          title=$(head -n 1 "docs/releases/$GITHUB_REF_NAME.md")
          title="${title#\# }"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --repo "$GITHUB_REPOSITORY" "${flags[@]}" --title "$title" --notes-file "docs/releases/$GITHUB_REF_NAME.md" release/PawTalk.Setup.*.exe release/PawTalk.Licenses.*.zip release/SHA256SUMS.txt release/update-manifest.json
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
  server:
    environment: release-publish
    if: needs.plan.outputs.component == 'server'
    needs: [plan, verify, prepare-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-server-prepared
          path: release
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Refuse replacing image version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # Query the authenticated registry; distinguish missing from authorization/network errors.
          token=$(curl --fail -sS -u "$GITHUB_ACTOR:$GH_TOKEN" 'https://ghcr.io/token?service=ghcr.io&scope=repository:ilyarusskikh/pawtalk-server:pull' | node -pe 'JSON.parse(fs.readFileSync(0)).token')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/ilyarusskikh/pawtalk-server/manifests/$VERSION")
          test "$code" = 404
      - name: Publish prepared image without changing its digest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          skopeo copy --all --preserve-digests --dest-creds "$GITHUB_ACTOR:$GH_TOKEN" oci-archive:release/server-image.tar "docker://ghcr.io/ilyarusskikh/pawtalk-server:$VERSION"
      - name: Publish Server metadata and Windows package
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          flags=(--latest=false)
          if [ "$CHANNEL" = preview ]; then flags+=(--prerelease); fi
          title=$(head -n 1 "docs/releases/$GITHUB_REF_NAME.md")
          title="${title#\# }"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --repo "$GITHUB_REPOSITORY" "${flags[@]}" --title "$title" --notes-file "docs/releases/$GITHUB_REF_NAME.md" release/server/server-manifest.json release/server/PawTalk.Server.*.windows-x64.zip
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
  manager:
    environment: release-publish
    if: needs.plan.outputs.component == 'manager'
    needs: [plan, verify, prepare-manager]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-manager-prepared
          path: release/manager
      - name: Publish Manager assets only
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          flags=(--latest=false)
          if [ "$CHANNEL" = preview ]; then flags+=(--prerelease); fi
          title=$(head -n 1 "docs/releases/$GITHUB_REF_NAME.md")
          title="${title#\# }"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --repo "$GITHUB_REPOSITORY" "${flags[@]}" --title "$title" --notes-file "docs/releases/$GITHUB_REF_NAME.md" release/manager/PawTalk.Manager.*.tar.gz release/manager/manager-manifest.json release/manager/PawTalk.Server.Manager.Setup.*.exe
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
