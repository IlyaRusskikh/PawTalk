name: Release Candidate Preflight
'on':
  workflow_dispatch:
    inputs:
      components:
        description: One component, comma-separated set, or all
        type: string
        default: all
        required: true
      promote:
        description: After preflight request separate tag and publication approvals
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-candidate-main
  cancel-in-progress: false
env:
  COMPONENTS: ${{ inputs.components }}
  PAWTALK_CLIENT_CHANNEL: ${{ vars.PAWTALK_CLIENT_CHANNEL || 'preview' }}
  PAWTALK_SERVER_CHANNEL: ${{ vars.PAWTALK_SERVER_CHANNEL || 'preview' }}
  PAWTALK_MANAGER_CHANNEL: ${{ vars.PAWTALK_MANAGER_CHANNEL || 'preview' }}
jobs:
  plan:
    if: github.ref == 'refs/heads/main' && github.repository == 'IlyaRusskikh/PawTalk'
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.plan.outputs.components }}
      client_tag: ${{ steps.plan.outputs.client_tag }}
      client_version: ${{ steps.plan.outputs.client_version }}
      client_channel: ${{ steps.plan.outputs.client_channel }}
      server_tag: ${{ steps.plan.outputs.server_tag }}
      server_version: ${{ steps.plan.outputs.server_version }}
      server_channel: ${{ steps.plan.outputs.server_channel }}
      manager_tag: ${{ steps.plan.outputs.manager_tag }}
      manager_version: ${{ steps.plan.outputs.manager_version }}
      manager_channel: ${{ steps.plan.outputs.manager_channel }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-candidate.mjs plan
  infrastructure:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - run: npm ci --ignore-scripts
      - run: node scripts/check-agents.mjs
      - run: node scripts/check-website.mjs
      - run: >-
          node --test tests/agent-infrastructure.test.mjs tests/release-catalog.test.mjs tests/ci-scope.test.mjs
          tests/release-routing.test.mjs tests/release-metadata.test.mjs tests/release-candidate.test.mjs tests/candidate-origin.test.mjs
      - name: Verify prepared OCI digest through isolated local registry
        run: node scripts/release-image-smoke.mjs
      - name: Lint all GitHub Actions workflows
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
  verify:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.components) }}
    uses: ./.github/workflows/check.yml
    with:
      component: ${{ matrix.component }}
      skip-infrastructure: true
      candidate: true
  prepare-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-windows
          path: release/client
      - name: Sign exact verified Client installer
        env:
          PAWTALK_UPDATE_PRIVATE_KEY: ${{ secrets.PAWTALK_UPDATE_PRIVATE_KEY }}
          PAWTALK_PRERELEASE: ${{ needs.plan.outputs.client_channel == 'preview' && 'true' || 'false' }}
        run: node scripts/sign-update.mjs release/client
      - name: Check complete prepared archives
        env:
          VERSION: ${{ needs.plan.outputs.client_version }}
        run: |-
          unzip -t "release/client/PawTalk.Licenses.$VERSION.zip"
          unzip -Z1 "release/client/PawTalk.Licenses.$VERSION.zip" | grep -x LICENSE
          unzip -Z1 "release/client/PawTalk.Licenses.$VERSION.zip" | grep -x THIRD_PARTY_NOTICES.md
          unzip -Z1 "release/client/PawTalk.Licenses.$VERSION.zip" | grep '^licenses/'
      - id: seal
        name: Verify signatures, completeness and seal source-bound receipt
        run: node scripts/release-candidate.mjs seal
      - uses: actions/upload-artifact@v6
        with:
          name: pawtalk-client-prepared
          if-no-files-found: error
          retention-days: 7
          path: release/client/*
    if: contains(fromJSON(needs.plan.outputs.components), 'client')
    needs:
      - plan
      - verify
      - infrastructure
    env:
      COMPONENTS: client
    outputs:
      digest: ${{ steps.seal.outputs.digest }}
  prepare-server:
    if: contains(fromJSON(needs.plan.outputs.components), 'server')
    needs:
      - plan
      - verify
      - infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-server-windows
          path: release/server
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Build complete multi-platform image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/standalone.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=release/server/server-image.tar
          labels: |
            org.opencontainers.image.source=https://github.com/IlyaRusskikh/PawTalk
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.server_version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: actions/download-artifact@v7
        if: contains(fromJSON(needs.plan.outputs.components), 'client')
        with:
          name: pawtalk-client-core
          path: release/client-core
      - name: Compare separately built Client and permanent Server cores
        if: contains(fromJSON(needs.plan.outputs.components), 'client')
        run: node scripts/release-candidate.mjs compare-core
      - name: Sign prepared Server digest and Windows package
        env:
          PAWTALK_SERVER_PRIVATE_KEY: ${{ secrets.PAWTALK_SERVER_PRIVATE_KEY }}
          PAWTALK_PRERELEASE: ${{ needs.plan.outputs.server_channel == 'preview' && 'true' || 'false' }}
        run: |
          skopeo inspect --raw oci-archive:release/server/server-image.tar > /tmp/server-index.json
          digest=$(sha256sum /tmp/server-index.json | cut -d ' ' -f 1)
          export PAWTALK_IMAGE_DIGEST="sha256:$digest"
          node scripts/release-metadata.mjs
      - name: Check complete prepared archives
        env:
          VERSION: ${{ needs.plan.outputs.server_version }}
        run: |-
          unzip -t "release/server/PawTalk.Server.$VERSION.windows-x64.zip"
          skopeo copy --all --preserve-digests oci-archive:release/server/server-image.tar "oci:$RUNNER_TEMP/verified-server:checked"
      - id: seal
        name: Verify signatures, completeness and seal source-bound receipt
        run: node scripts/release-candidate.mjs seal
      - uses: actions/upload-artifact@v6
        with:
          name: pawtalk-server-prepared
          if-no-files-found: error
          retention-days: 7
          path: release/server/*
    env:
      COMPONENTS: server
      PAWTALK_RELEASE_TAG: ${{ needs.plan.outputs.server_tag }}
    outputs:
      digest: ${{ steps.seal.outputs.digest }}
  prepare-manager:
    if: contains(fromJSON(needs.plan.outputs.components), 'manager')
    needs:
      - plan
      - verify
      - infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-manager-windows
          path: release/manager
      - name: Sign complete Manager bundle
        env:
          PAWTALK_MANAGER_PRIVATE_KEY: ${{ secrets.PAWTALK_MANAGER_PRIVATE_KEY }}
          PAWTALK_PRERELEASE: ${{ needs.plan.outputs.manager_channel == 'preview' && 'true' || 'false' }}
        run: node scripts/release-metadata.mjs
      - name: Check complete prepared archives
        env:
          VERSION: ${{ needs.plan.outputs.manager_version }}
        run: tar -tzf "release/manager/PawTalk.Manager.$VERSION.tar.gz"
      - id: seal
        name: Verify signatures, completeness and seal source-bound receipt
        run: node scripts/release-candidate.mjs seal
      - uses: actions/upload-artifact@v6
        with:
          name: pawtalk-manager-prepared
          if-no-files-found: error
          retention-days: 7
          path: release/manager/*
    env:
      COMPONENTS: manager
      PAWTALK_RELEASE_TAG: ${{ needs.plan.outputs.manager_tag }}
    outputs:
      digest: ${{ steps.seal.outputs.digest }}
  preflight:
    if: >-
      always() && needs.plan.result == 'success' && needs.verify.result == 'success' && needs.infrastructure.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs:
      - plan
      - verify
      - infrastructure
      - prepare-client
      - prepare-server
      - prepare-manager
    runs-on: ubuntu-latest
    outputs:
      receipts: ${{ steps.receipts.outputs.value }}
    env:
      RECEIPTS: >-
        { "client": "${{ needs.prepare-client.outputs.digest }}", "server": "${{ needs.prepare-server.outputs.digest }}", "manager": "${{
        needs.prepare-manager.outputs.digest }}" }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-client-prepared
          path: candidate/client
        if: contains(fromJSON(needs.plan.outputs.components), 'client')
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-server-prepared
          path: candidate/server
        if: contains(fromJSON(needs.plan.outputs.components), 'server')
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-manager-prepared
          path: candidate/manager
        if: contains(fromJSON(needs.plan.outputs.components), 'manager')
      - name: Validate and save original candidate contracts for later promotion
        run: node scripts/release-candidate.mjs snapshot
      - uses: actions/upload-artifact@v6
        with:
          name: pawtalk-candidate-index
          path: release/candidate-index/candidate.json
          if-no-files-found: error
          retention-days: 7
      - id: receipts
        run: echo "value=$RECEIPTS" >> "$GITHUB_OUTPUT"
      - name: Report component readiness
        run: >
          node --input-type=module <<'NODE'

          import fs from "node:fs"; for(const [c,d] of Object.entries(JSON.parse(process.env.RECEIPTS))) if(d)
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- ${c}: READY; source ${process.env.GITHUB_SHA}; receipt ${d}\n`);

          NODE
  tag:
    if: always() && needs.plan.result == 'success' && needs.preflight.result == 'success' && inputs.promote && github.ref == 'refs/heads/main'
    needs:
      - plan
      - preflight
    environment: release-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RECEIPTS: ${{ needs.preflight.outputs.receipts }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-client-prepared
          path: candidate/client
        if: contains(fromJSON(needs.plan.outputs.components), 'client')
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-server-prepared
          path: candidate/server
        if: contains(fromJSON(needs.plan.outputs.components), 'server')
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-manager-prepared
          path: candidate/manager
        if: contains(fromJSON(needs.plan.outputs.components), 'manager')
      - name: Create only checked immutable tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-candidate.mjs tag
  report:
    if: always()
    needs:
      - plan
      - verify
      - infrastructure
      - prepare-client
      - prepare-server
      - prepare-manager
      - preflight
      - tag
      - publish-client
      - publish-server
      - publish-manager
    runs-on: ubuntu-latest
    steps:
      - name: Report exact stage outcomes, including failures and rejections
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: >
          node --input-type=module <<'NODE'

          import fs from "node:fs"; for(const [name,job] of Object.entries(JSON.parse(process.env.RESULTS)))
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- ${name}: ${job.result}\n`);

          NODE
  publish-client:
    if: >-
      always() && needs.preflight.result == 'success' && needs.tag.result == 'success' && contains(fromJSON(needs.plan.outputs.components),
      'client') && github.ref == 'refs/heads/main'
    needs:
      - plan
      - preflight
      - tag
    environment: release-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RECEIPTS: ${{ needs.preflight.outputs.receipts }}
      COMPONENTS: client
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-client-prepared
          path: candidate/client
      - name: Publish only prepared artifacts; never rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-candidate.mjs publish
  publish-server:
    if: >-
      always() && needs.preflight.result == 'success' && needs.tag.result == 'success' && contains(fromJSON(needs.plan.outputs.components),
      'server') && github.ref == 'refs/heads/main'
    needs:
      - plan
      - preflight
      - tag
    environment: release-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RECEIPTS: ${{ needs.preflight.outputs.receipts }}
      COMPONENTS: server
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-server-prepared
          path: candidate/server
      - name: Publish only prepared artifacts; never rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-candidate.mjs publish
  publish-manager:
    if: >-
      always() && needs.preflight.result == 'success' && needs.tag.result == 'success' && contains(fromJSON(needs.plan.outputs.components),
      'manager') && github.ref == 'refs/heads/main'
    needs:
      - plan
      - preflight
      - tag
    environment: release-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RECEIPTS: ${{ needs.preflight.outputs.receipts }}
      COMPONENTS: manager
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v7
        with:
          name: pawtalk-manager-prepared
          path: candidate/manager
      - name: Publish only prepared artifacts; never rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-candidate.mjs publish
