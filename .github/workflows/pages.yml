name: Publish project website
# Only successful publication (or deliberate manual recovery) deploys Pages.
on:
  workflow_dispatch:
  release:
    types: [published]
  workflow_run:
    workflows: ['Publish component release']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' &&
      (startsWith(github.event.release.tag_name, 'client-v') || startsWith(github.event.release.tag_name, 'server-v') || startsWith(github.event.release.tag_name, 'manager-v'))) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - name: Generate complete catalog from published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-catalog.mjs
      - run: node scripts/check-website.mjs --catalog
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
