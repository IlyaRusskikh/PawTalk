name: Publish project website
'on':
  workflow_dispatch: null
  release:
    types:
      - published
  workflow_run:
    workflows:
      - Release Candidate Preflight
      - Promote Existing Preflight
    types:
      - completed
permissions:
  contents: read
  actions: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' &&
      (startsWith(github.event.release.tag_name, 'client-v') || startsWith(github.event.release.tag_name, 'server-v') ||
      startsWith(github.event.release.tag_name, 'manager-v'))) || (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require actual successful publication, not prepare-only success
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          if [ -z "$RUN_ID" ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; exit 0; fi

          ready=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select((.name | startswith("publish-")) and
          .conclusion == "success") | .id')

          if [ -n "$ready" ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v6
        with:
          ref: main
        if: steps.publication.outputs.ready == 'true'
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
        if: steps.publication.outputs.ready == 'true'
      - name: Generate complete catalog from published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/release/release-catalog.mjs
        if: steps.publication.outputs.ready == 'true'
      - run: node tooling/ci/check-website.mjs --catalog
        if: steps.publication.outputs.ready == 'true'
      - uses: actions/configure-pages@v6
        if: steps.publication.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/website
        if: steps.publication.outputs.ready == 'true'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        if: steps.publication.outputs.ready == 'true'
