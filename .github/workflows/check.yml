name: Verify and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test -race ./... && go vet ./...
        working-directory: server
      - run: docker build -f server/Dockerfile -t voicecord-api:test .
      - run: docker compose -f compose.yaml config --no-env-resolution -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: node scripts/check-public.mjs
      - run: node scripts/server-smoke.mjs
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: npm ci
      - run: npm run check:public
      - run: npm run native:build
      - run: node scripts/native-smoke.cjs
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      - run: npm run package
      - name: Prepare release files
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/Voicecord Setup $version.exe"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Voicecord Setup $version.exe" | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md -Destination release
          Copy-Item licenses -Destination release -Recurse -Force
      - uses: actions/upload-artifact@v4
        with:
          name: voicecord-windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/LICENSE
            release/THIRD_PARTY_NOTICES.md
            release/licenses/**
