name: Verify and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test -race ./... && go vet ./...
        working-directory: server
      - run: docker build -f server/Dockerfile -t voicecord-api:test .
      - name: Validate legacy Compose without local secrets
        run: |
          mkdir -p deploy/generated
          touch deploy/generated/api.env deploy/generated/proxy.env
          docker compose -f compose.yaml config -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: node scripts/check-public.mjs
      - run: node scripts/check-website.mjs
      - run: docker compose --env-file .env.server.example -f compose.server.ghcr.yaml config -q
      - run: node scripts/server-smoke.mjs
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: npm ci
      - run: npm run check:public
      - run: npm run native:build
      - run: node scripts/native-smoke.cjs
      - run: npm run build
      - run: npm test
      - run: python -m unittest discover -s tests -p server_update_test.py
      - run: npm run smoke
      - run: node scripts/ui-flow-smoke.mjs --built
      - run: node scripts/updates-ui-smoke.mjs
      - run: node scripts/fixes-main-smoke.mjs
      - run: npm run package
      - run: node scripts/realtime-smoke.mjs
      - run: node scripts/chat-ui-smoke.mjs
      - run: node scripts/chat-main-smoke.mjs
      - name: Prepare release files
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/Voicecord Setup $version.exe"
          $publishedInstaller = "release/Voicecord.Setup.$version.exe"
          Move-Item -LiteralPath $installer -Destination $publishedInstaller
          $hash = (Get-FileHash -LiteralPath $publishedInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Voicecord.Setup.$version.exe" | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md -Destination release
          Copy-Item licenses -Destination release -Recurse -Force
          $licenseFiles = @((Resolve-Path release/LICENSE).Path, (Resolve-Path release/THIRD_PARTY_NOTICES.md).Path, (Resolve-Path release/licenses).Path)
          Compress-Archive -LiteralPath $licenseFiles -DestinationPath "release/Voicecord.Licenses.$version.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: voicecord-windows
          if-no-files-found: error
          path: |
            release/Voicecord.Setup.*.exe
            release/SHA256SUMS.txt
            release/Voicecord.Licenses.*.zip
  publish-server:
    name: Publish server image to GHCR
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [server, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-server-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Validate release and select image name
        id: image
        shell: bash
        run: |
          node scripts/check-public.mjs
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prevent replacing an existing release image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        run: |
          if docker manifest inspect "${IMAGE_NAME}:${IMAGE_VERSION}" >/dev/null 2>&1; then
            echo "::error::Image version already exists. Publish a new version instead of replacing it."
            exit 1
          fi
      - name: Build and publish tested server
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/standalone.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.description=Self-hosted Voicecord voice room server
      - name: Record image and digest
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "Published: ${IMAGE_NAME}:${IMAGE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable reference: ${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: linux/amd64, linux/arm64 (automatic selection on pull)." >> "$GITHUB_STEP_SUMMARY"
          echo "First publication: make the GHCR package public to allow anonymous pulls." >> "$GITHUB_STEP_SUMMARY"
