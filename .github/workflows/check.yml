name: Verify and package
on:
  push:
    branches: ['**']
    tags: ['v0.8.1']
  pull_request:
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [all, client, server, manager]
        default: all
  workflow_call:
    inputs:
      component:
        description: Component to package; all for branch/PR verification
        type: string
        default: all
      client-prerelease:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ inputs.component || 'all' }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
  cancel-in-progress: true
jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Select verification scope
        id: scope
        env:
          PAWTALK_CI_COMPONENT: ${{ inputs.component || 'all' }}
        run: node scripts/ci-scope.mjs
      - uses: actions/setup-go@v5
        if: steps.scope.outputs.server == 'true'
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test -race ./... && go vet ./...
        if: steps.scope.outputs.server == 'true'
        working-directory: server
      - run: docker build -f server/Dockerfile -t pawtalk-api:test .
        if: steps.scope.outputs.server == 'true'
      - run: node scripts/check-public.mjs
      - run: node scripts/check-website.mjs
      - run: node --check scripts/dev-server.mjs && node --check scripts/docker-smoke.mjs
      - name: Resolve published Server test dependency
        if: steps.scope.outputs.publishedServer == 'true'
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/prepare-server-fixture.py --github-output
          image=$(sed -n 's/^image=//p' "$GITHUB_OUTPUT")
          docker pull "$image"
          docker tag "$image" pawtalk-server:local
      - name: Verify bundled server lifecycle and authentication with real Docker
        env:
          PAWTALK_TEST_IMAGE: ${{ steps.published.outputs.image }}
        run: node scripts/server-smoke.mjs
      - name: Verify actual developer Docker launch and TLS pinning
        if: steps.scope.outputs.server == 'true'
        run: node scripts/dev-server.mjs --smoke
      - name: Verify API + LiveKit containers and tokens without Compose
        if: steps.scope.outputs.server == 'true'
        run: node scripts/docker-smoke.mjs --containers-only
      - name: Host tools and signed release contracts
        if: steps.scope.outputs.host == 'true'
        run: sudo python3 -m unittest discover -s tests -p '*_test.py'
      - name: Verify actual systemd units and oneshot execution
        if: steps.scope.outputs.host == 'true'
        run: |
          sudo install -D -m 0755 manager/launcher /opt/pawtalk-manager/launcher
          systemd-analyze verify manager/pawtalk-update.service manager/pawtalk-update.timer manager/pawtalk-health.service manager/pawtalk-health.timer
          sudo systemd-run --wait --collect --unit="pawtalk-ci-selftest-${GITHUB_RUN_ID}" /usr/bin/python3 "$GITHUB_WORKSPACE/manager/pawtalkctl" --self-test
      - name: Real Compose install, backup, upgrade, restore and crash recovery
        if: steps.scope.outputs.host == 'true'
        run: sudo python3 tests/compose_integration.py
        timeout-minutes: 25
      - name: Compose E2EE policy and opaque-history persistence across the full lifecycle
        if: steps.scope.outputs.host == 'true'
        env:
          PAWTALK_COMPOSE_TEST_E2EE: 'true'
        run: sudo --preserve-env=PAWTALK_COMPOSE_TEST_E2EE python3 tests/compose_integration.py
        timeout-minutes: 25
      - name: Debian 12 userspace install and recovery with the real Docker engine
        if: steps.scope.outputs.host == 'true'
        run: |
          docker build -f tests/vps.Dockerfile -t pawtalk-vps-test:debian12 .
          docker run --rm --network host --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock -e PYTHONUNBUFFERED=1 pawtalk-vps-test:debian12 python3 tests/compose_integration.py
        timeout-minutes: 25
      - name: Verify new Client API against published Server 0.8.0
        if: steps.scope.outputs.client == 'true' || steps.scope.outputs.server == 'true'
        env:
          PAWTALK_TEST_IMAGE: ghcr.io/ilyarusskikh/pawtalk-server@sha256:601bd68f577c63a98b3dfec040b01379467576dfc6d16c15f2bf7501ac86b8f0
        run: node scripts/server-smoke.mjs
  windows:
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Select verification scope
        id: scope
        env:
          PAWTALK_CI_COMPONENT: ${{ inputs.component || 'all' }}
        run: node scripts/ci-scope.mjs
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.host == 'true'
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: npm ci
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Electron with retries
        env:
          electron_config_cache: ${{ runner.temp }}\electron-cache
        run: node scripts/install-electron.mjs
      - run: npm run check:public
      - name: Test release routing and CI component contracts
        if: steps.scope.outputs.client != 'true'
        run: node --test tests/release-routing.test.mjs tests/release-metadata.test.mjs tests/ci-scope.test.mjs
      - run: npm run native:build
        if: steps.scope.outputs.client == 'true'
      - run: node scripts/native-smoke.cjs
        if: steps.scope.outputs.client == 'true'
      - run: npm run build
        if: steps.scope.outputs.client == 'true'
      - run: npm run test:sounds
        if: steps.scope.outputs.client == 'true'
      - name: Test Client including real Windows TLS diagnostics
        if: steps.scope.outputs.client == 'true'
        run: |
          $env:PAWTALK_GO = (Get-Command go -ErrorAction Stop).Source
          npm test
      - run: npm run server:prepare
        if: steps.scope.outputs.client == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify native Manager host safeguards
        if: steps.scope.outputs.host == 'true'
        working-directory: manager/windows
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
      - name: Verify Windows handoff completion and read-only cleanup
        if: steps.scope.outputs.host == 'true'
        run: python -m unittest discover -s tests -p windows_handoff_test.py
      - name: Prepare host test audio assets
        if: steps.scope.outputs.host == 'true' && steps.scope.outputs.client != 'true'
        run: node scripts/prepare-rnnoise.mjs
      - name: Prepare LiveKit without the bundled Client API
        if: steps.scope.outputs.server == 'true' && steps.scope.outputs.client != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-server.mjs --livekit-only
      - name: Build permanent Windows Server
        if: steps.scope.outputs.server == 'true'
        run: node scripts/build-windows-server.mjs
      - name: Build Windows Manager installer
        if: steps.scope.outputs.manager == 'true'
        run: node scripts/build-manager-windows.mjs
      - name: Prepare Manager test host without an installer
        if: steps.scope.outputs.host == 'true' && steps.scope.outputs.manager != 'true'
        run: node scripts/build-manager-windows.mjs --runtime-only
      - name: Fetch signed published Windows Server test dependency
        if: steps.scope.outputs.manager == 'true' && steps.scope.outputs.server != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAWTALK_MANAGER_HOST: ${{ github.workspace }}\release\manager\windows\pawtalkctl.exe
        run: python scripts/prepare-server-fixture.py --windows-zip release/qa/windows-server-fixture.zip
      - name: Verify native Windows lifecycle with actual SCM services
        if: steps.scope.outputs.host == 'true'
        env:
          PAWTALK_WINDOWS_SERVER_ZIP: ${{ steps.scope.outputs.server != 'true' && 'release/qa/windows-server-fixture.zip' || '' }}
        run: node scripts/windows-manager-smoke.mjs --scm ${{ steps.scope.outputs.manager == 'true' && '--installer' || '' }}
      - name: Upload Windows Server package
        if: steps.scope.outputs.server == 'true' && matrix.runner == 'windows-2025'
        uses: actions/upload-artifact@v4
        with:
          name: pawtalk-server-windows
          if-no-files-found: error
          path: release/server/PawTalk.Server.*.windows-x64.zip
      - name: Upload Windows Manager installer
        if: steps.scope.outputs.manager == 'true' && matrix.runner == 'windows-2025'
        uses: actions/upload-artifact@v4
        with:
          name: pawtalk-manager-windows
          if-no-files-found: error
          path: release/manager/PawTalk.Server.Manager.Setup.*.exe
      - run: npm run smoke
        if: steps.scope.outputs.client == 'true'
      - run: node scripts/ui-flow-smoke.mjs --built
        if: steps.scope.outputs.client == 'true'
      - name: Verify legacy Manager invitations with native clipboard paste
        if: steps.scope.outputs.client == 'true'
        run: node scripts/manager-invitation-smoke.mjs
      - name: Verify bookmark identity and locked room privacy
        if: steps.scope.outputs.client == 'true'
        run: node scripts/bookmarks-smoke.mjs
      - run: npm run test:connection-ui
        if: steps.scope.outputs.client == 'true'
      - run: node scripts/updates-ui-smoke.mjs
        if: steps.scope.outputs.client == 'true'
      - name: Verify update button geometry in Russian and English
        if: steps.scope.outputs.client == 'true'
        run: node scripts/update-layout-smoke.mjs
      - run: node scripts/fixes-main-smoke.mjs
        if: steps.scope.outputs.client == 'true'
      - name: Cache LiveKit server
        if: steps.scope.outputs.client == 'true'
        uses: actions/cache@v4
        with:
          path: |
            resources/server/livekit-server.exe
            resources/server/LIVEKIT-LICENSE
          key: livekit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-server.mjs') }}
      - name: Cache electron-builder tools
        if: steps.scope.outputs.client == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\electron-builder-cache
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-${{ runner.arch }}-
      - name: Package PawTalk
        if: steps.scope.outputs.client == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npm run package
      - name: Verify packaged Client, pinned binaries and receipt
        if: steps.scope.outputs.client == 'true'
        run: node scripts/packaged-smoke.mjs
      - run: node scripts/realtime-smoke.mjs
        if: steps.scope.outputs.client == 'true'
      - run: node scripts/chat-ui-smoke.mjs
        if: steps.scope.outputs.client == 'true'
      - run: node scripts/chat-main-smoke.mjs
        if: steps.scope.outputs.client == 'true'
      - name: Prepare release files
        if: steps.scope.outputs.client == 'true'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/PawTalk Setup $version.exe"
          $publishedInstaller = "release/PawTalk.Setup.$version.exe"
          Move-Item -LiteralPath $installer -Destination $publishedInstaller
          $hash = (Get-FileHash -LiteralPath $publishedInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PawTalk.Setup.$version.exe" | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md -Destination release
          Copy-Item licenses -Destination release -Recurse -Force
          $licenseFiles = @((Resolve-Path release/LICENSE).Path, (Resolve-Path release/THIRD_PARTY_NOTICES.md).Path, (Resolve-Path release/licenses).Path)
          Compress-Archive -LiteralPath $licenseFiles -DestinationPath "release/PawTalk.Licenses.$version.zip" -CompressionLevel Optimal
      - name: Sign release update manifest
        if: steps.scope.outputs.client == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/client-v')
        env:
          PAWTALK_UPDATE_PRIVATE_KEY: ${{ secrets.PAWTALK_UPDATE_PRIVATE_KEY }}
          PAWTALK_PRERELEASE: ${{ inputs.client-prerelease && 'true' || 'false' }}
        run: node scripts/sign-update.mjs
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.client == 'true' && matrix.runner == 'windows-2025'
        with:
          name: pawtalk-windows
          if-no-files-found: error
          path: |
            release/PawTalk.Setup.*.exe
            release/SHA256SUMS.txt
            release/PawTalk.Licenses.*.zip
            release/update-manifest.json
