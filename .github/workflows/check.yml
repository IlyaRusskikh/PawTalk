name: Verify and package
on:
  pull_request:
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [all, client, server, manager]
        default: all
  workflow_call:
    inputs:
      component:
        description: Component to package; all for PR verification
        type: string
        default: all
      skip-infrastructure:
        type: boolean
        default: false
      candidate:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ inputs.component || 'all' }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}-${{ inputs.candidate && github.run_id || 'development' }}
  cancel-in-progress: true
jobs:
  infrastructure:
    if: ${{ !inputs.skip-infrastructure }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts
      - run: node tooling/ci/check-release-notes.mjs
      - run: node tooling/ci/check-docs.mjs
      - run: node --test tests/infrastructure/documentation.test.mjs
      - run: node tooling/ci/check-agents.mjs
      - run: node tooling/ci/check-website.mjs
      - run: node --test tests/infrastructure/agent-infrastructure.test.mjs tests/release/release-catalog.test.mjs tests/infrastructure/ci-scope.test.mjs tests/release/release-routing.test.mjs tests/release/release-metadata.test.mjs tests/release/release-candidate.test.mjs tests/release/candidate-origin.test.mjs tests/release/release-notes.test.mjs
      - name: Verify prepared OCI digest through isolated local registry
        run: node tooling/ci/release-image-smoke.mjs
      - name: Lint all GitHub Actions workflows
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
  server:
    name: Server + Manager / Linux (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - name: Select verification scope
        id: scope
        env:
          PAWTALK_CI_COMPONENT: ${{ inputs.component || 'all' }}
        run: node tooling/ci/ci-scope.mjs
      - uses: actions/setup-go@v6
        if: steps.scope.outputs.server == 'true'
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test -race ./... && go vet ./...
        if: steps.scope.outputs.server == 'true'
        working-directory: apps/server
      - name: Build current API 2 integration dependency
        run: docker build -f apps/server/deploy/standalone.Dockerfile -t pawtalk-server:local .
      - run: node tooling/ci/check-public.mjs
      - run: node tooling/ci/check-website.mjs
      - run: node --check tooling/dev/dev-server.mjs && node --check apps/server/scripts/docker-smoke.mjs
      - name: Verify bundled server lifecycle and authentication with real Docker
        env:
          PAWTALK_TEST_IMAGE: pawtalk-server:local
        run: node apps/server/scripts/server-smoke.mjs
      - name: Verify actual developer Docker launch and TLS pinning
        if: steps.scope.outputs.server == 'true'
        run: node tooling/dev/dev-server.mjs --smoke
      - name: Verify shared API 2 container and tokens without Compose
        if: steps.scope.outputs.server == 'true'
        run: node apps/server/scripts/docker-smoke.mjs --containers-only
      - name: Host tools and signed release contracts
        if: steps.scope.outputs.host == 'true'
        run: sudo python3 -m unittest discover -s apps/manager/tests -p '*_test.py'
      - name: Verify actual systemd units and oneshot execution
        if: steps.scope.outputs.host == 'true'
        run: |
          sudo install -D -m 0755 apps/manager/linux/launcher /opt/pawtalk-manager/launcher
          systemd-analyze verify apps/manager/linux/deploy/pawtalk-update.service apps/manager/linux/deploy/pawtalk-update.timer apps/manager/linux/deploy/pawtalk-health.service apps/manager/linux/deploy/pawtalk-health.timer
          sudo systemd-run --wait --collect --unit="pawtalk-ci-selftest-${GITHUB_RUN_ID}" /usr/bin/python3 "$GITHUB_WORKSPACE/apps/manager/linux/pawtalkctl" --self-test
      - name: Real Compose install, backup, upgrade, restore and crash recovery
        if: steps.scope.outputs.host == 'true'
        run: sudo python3 apps/manager/tests/compose_integration.py
        timeout-minutes: 25
      - name: Debian 12 userspace install and recovery with the real Docker engine
        if: steps.scope.outputs.host == 'true'
        run: |
          docker build -f tests/integration/vps.Dockerfile -t pawtalk-vps-test:debian12 .
          docker run --rm --network host --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock -e PYTHONUNBUFFERED=1 pawtalk-vps-test:debian12 python3 apps/manager/tests/compose_integration.py
        timeout-minutes: 25
      - name: Verify explicit rejection of frozen published Server 0.8.0
        if: steps.scope.outputs.client == 'true' || steps.scope.outputs.server == 'true'
        env:
          PAWTALK_TEST_IMAGE: ghcr.io/ilyarusskikh/pawtalk-server@sha256:601bd68f577c63a98b3dfec040b01379467576dfc6d16c15f2bf7501ac86b8f0
        run: node apps/server/scripts/server-smoke.mjs --legacy-rejection
  windows:
    name: Client + Server + Manager / Windows (${{ matrix.runner }})
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Select verification scope
        id: scope
        env:
          PAWTALK_CI_COMPONENT: ${{ inputs.component || 'all' }}
        run: node tooling/ci/ci-scope.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - run: npm ci
      - name: Cache Electron binary
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Electron with retries
        env:
          electron_config_cache: ${{ runner.temp }}\electron-cache
        run: node apps/client/windows/scripts/install-electron.mjs
      - name: Verify actual website downloads in English and Russian
        run: node tooling/ci/website-smoke.mjs
      - run: npm run check:public
      - name: Test release routing and CI component contracts
        if: steps.scope.outputs.client != 'true'
        run: node --test tests/release/release-routing.test.mjs tests/release/release-metadata.test.mjs tests/infrastructure/ci-scope.test.mjs
      - run: npm run native:build
        if: steps.scope.outputs.client == 'true'
      - run: node apps/client/windows/scripts/native-smoke.cjs
        if: steps.scope.outputs.client == 'true'
      - name: Build Client renderer for Client and host integration
        if: steps.scope.outputs.client == 'true' || steps.scope.outputs.host == 'true'
        run: npm run build
      - run: npm run test:sounds
        if: steps.scope.outputs.client == 'true'
      - name: Test Client including real Windows TLS diagnostics
        if: steps.scope.outputs.client == 'true'
        run: |
          $env:PAWTALK_GO = (Get-Command go -ErrorAction Stop).Source
          npm test
      - run: npm run server:prepare
        if: steps.scope.outputs.client == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify shared Go core on native Windows
        if: steps.scope.outputs.client == 'true' || steps.scope.outputs.server == 'true'
        working-directory: apps/server
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
      - name: Verify native Manager host safeguards
        if: steps.scope.outputs.host == 'true'
        working-directory: apps/manager/windows/service
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
      - name: Verify Windows handoff completion and read-only cleanup
        if: steps.scope.outputs.host == 'true'
        run: python -m unittest discover -s apps/manager/tests -p windows_handoff_test.py
      - name: Prepare host test audio assets
        if: steps.scope.outputs.host == 'true' && steps.scope.outputs.client != 'true'
        run: node apps/client/windows/scripts/prepare-rnnoise.mjs
      - name: Prepare LiveKit without the bundled Client API
        if: steps.scope.outputs.host == 'true' && steps.scope.outputs.client != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/build/prepare-server.mjs --livekit-only
      - name: Build permanent Windows Server
        if: steps.scope.outputs.server == 'true'
        run: node apps/server/scripts/build-windows-server.mjs
      - name: Verify identical Client and permanent Server cores
        if: steps.scope.outputs.server == 'true' && steps.scope.outputs.client == 'true'
        run: node tooling/build/check-server-core.mjs
      - name: Verify shared-core temporary rooms with real Electron IPC
        if: steps.scope.outputs.client == 'true'
        run: node apps/client/windows/scripts/selfhost-main-smoke.mjs
      - name: Verify shared-core temporary API privacy and chat lifecycle
        if: steps.scope.outputs.client == 'true'
        run: node apps/client/windows/scripts/selfhost-smoke.cjs
      - name: Build Windows Manager installer
        if: steps.scope.outputs.manager == 'true'
        run: node apps/manager/windows/scripts/build-manager-windows.mjs
      - name: Verify Manager desktop UI and native tray
        if: steps.scope.outputs.manager == 'true'
        run: node apps/manager/windows/scripts/manager-desktop-smoke.mjs
      - name: Packaged Manager hidden startup
        if: steps.scope.outputs.manager == 'true'
        run: node apps/manager/windows/scripts/manager-packaged-smoke.mjs
      - name: Prepare Manager test host without an installer
        if: steps.scope.outputs.host == 'true' && steps.scope.outputs.manager != 'true'
        run: node apps/manager/windows/scripts/build-manager-windows.mjs --runtime-only
      - name: Build current API 2 Windows Server test dependency
        if: steps.scope.outputs.manager == 'true' && steps.scope.outputs.server != 'true'
        id: api2fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node apps/server/scripts/build-windows-server.mjs --output-dir release/qa/api2-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content apps/server/VERSION -Raw).Trim()
          "zip=release/qa/api2-server/PawTalk.Server.$version.windows-x64.zip" >> $env:GITHUB_OUTPUT
      - name: Verify native Windows lifecycle with actual SCM services
        if: steps.scope.outputs.host == 'true'
        env:
          PAWTALK_WINDOWS_SERVER_ZIP: ${{ steps.api2fixture.outputs.zip }}
        run: node apps/manager/windows/scripts/windows-manager-smoke.mjs --scm ${{ steps.scope.outputs.manager == 'true' && '--installer' || '' }}
      - name: Upload Windows Server package
        if: steps.scope.outputs.server == 'true' && matrix.runner == 'windows-2025'
        uses: actions/upload-artifact@v6
        with:
          name: pawtalk-server-windows
          if-no-files-found: error
          path: release/server/PawTalk.Server.*.windows-x64.zip
      - name: Upload Windows Manager installer
        if: steps.scope.outputs.manager == 'true' && matrix.runner == 'windows-2025'
        uses: actions/upload-artifact@v6
        with:
          name: pawtalk-manager-windows
          if-no-files-found: error
          path: release/manager/PawTalk.Server.Manager.Setup.*.exe
      - run: npm run smoke
        if: steps.scope.outputs.client == 'true'
      - run: npm run test:connection-ui
        if: steps.scope.outputs.client == 'true'
      - run: node apps/client/windows/scripts/updates-ui-smoke.mjs
        if: steps.scope.outputs.client == 'true'
      - name: Verify update button geometry in Russian and English
        if: steps.scope.outputs.client == 'true'
        run: node apps/client/windows/scripts/update-layout-smoke.mjs
      - name: Cache LiveKit server
        if: steps.scope.outputs.client == 'true'
        uses: actions/cache@v5
        with:
          path: |
            resources/server/livekit-server.exe
            resources/server/LIVEKIT-LICENSE
          key: livekit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tooling/build/prepare-server.mjs') }}
      - name: Cache electron-builder tools
        if: steps.scope.outputs.client == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\electron-builder-cache
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-${{ runner.arch }}-
      - name: Package PawTalk
        if: steps.scope.outputs.client == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npm run package
      - name: Verify packaged Client, shared core and receipt
        if: steps.scope.outputs.client == 'true'
        run: node apps/client/windows/scripts/packaged-smoke.mjs
      - name: Prepare release files
        if: steps.scope.outputs.client == 'true'
        shell: pwsh
        run: |
          $version = (Get-Content apps/client/windows/package.json -Raw | ConvertFrom-Json).version
          $installer = "release/PawTalk Setup $version.exe"
          $publishedInstaller = "release/PawTalk.Setup.$version.exe"
          Move-Item -LiteralPath $installer -Destination $publishedInstaller
          $hash = (Get-FileHash -LiteralPath $publishedInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PawTalk.Setup.$version.exe" | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md -Destination release
          Copy-Item licenses -Destination release -Recurse -Force
          $licenseFiles = @((Resolve-Path release/LICENSE).Path, (Resolve-Path release/THIRD_PARTY_NOTICES.md).Path, (Resolve-Path release/licenses).Path)
          Compress-Archive -LiteralPath $licenseFiles -DestinationPath "release/PawTalk.Licenses.$version.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@v6
        if: steps.scope.outputs.client == 'true' && matrix.runner == 'windows-2025'
        with:
          name: pawtalk-windows
          if-no-files-found: error
          path: |
            release/PawTalk.Setup.*.exe
            release/SHA256SUMS.txt
            release/PawTalk.Licenses.*.zip
      - name: Keep verified Client core receipt for cross-scope comparison
        if: (inputs.candidate || github.event_name == 'pull_request') && steps.scope.outputs.client == 'true' && matrix.runner == 'windows-2025'
        uses: actions/upload-artifact@v6
        with:
          name: pawtalk-client-core
          if-no-files-found: error
          path: resources/server/bundled-server.json
      - name: Record the verified PR checkout
        if: github.event_name == 'pull_request' && matrix.runner == 'windows-2025'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node tooling/release/pr-candidate.mjs record
      - name: Upload verified PR checkout evidence
        if: github.event_name == 'pull_request' && matrix.runner == 'windows-2025'
        uses: actions/upload-artifact@v6
        with:
          name: pawtalk-pr-build
          if-no-files-found: error
          path: release/pr-build/source.json
