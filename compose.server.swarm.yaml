# One stateful room on the node holding its existing volume. See docs/SWARM.md.
version: '3.8'
services:
  server:
    image: ${VOICECORD_IMAGE:?Set VOICECORD_IMAGE}
    networks: [host]
    environment:
      VOICECORD_PUBLIC_IP: ${VOICECORD_PUBLIC_IP:?Set VOICECORD_PUBLIC_IP}
      VOICECORD_PORT: ${VOICECORD_PORT:-18443}
      VOICECORD_E2EE: ${VOICECORD_E2EE:-false}
      VOICECORD_E2EE_KEY_ID: ${VOICECORD_E2EE_KEY_ID:-}
      VOICECORD_CHAT_MAX_MB: ${VOICECORD_CHAT_MAX_MB:-128}
    volumes:
      - server_data:/data
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
    read_only: true
    cap_drop: [ALL]
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, /voicecord, serve, healthcheck]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      replicas: 1
      labels:
        io.voicecord.managed: 'true'
        io.voicecord.version: ${VOICECORD_RELEASE:-0.4.1}
      placement:
        constraints: [node.labels.voicecord.data == true]
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
        monitor: 60s
      restart_policy:
        condition: any
        delay: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  host:
    external: true
    name: host
volumes:
  server_data:
    external: true
    name: ${VOICECORD_DATA_VOLUME:?Set the existing data volume name}
