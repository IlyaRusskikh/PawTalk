# One stateful room on the node holding its existing volume. See docs/SWARM.md.
version: '3.8'
services:
  server:
    image: ${PAWTALK_IMAGE:?Set PAWTALK_IMAGE}
    networks: [host]
    environment:
      PAWTALK_PUBLIC_IP: ${PAWTALK_PUBLIC_IP:?Set PAWTALK_PUBLIC_IP}
      PAWTALK_PORT: ${PAWTALK_PORT:-18443}
      PAWTALK_E2EE: ${PAWTALK_E2EE:-false}
      PAWTALK_E2EE_KEY_ID: ${PAWTALK_E2EE_KEY_ID:-}
      PAWTALK_CHAT_MAX_MB: ${PAWTALK_CHAT_MAX_MB:-128}
      PAWTALK_UPDATE_PROXY: ${PAWTALK_UPDATE_PROXY:-true}
    volumes:
      - server_data:/data
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
    read_only: true
    cap_drop: [ALL]
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, /pawtalk, serve, healthcheck]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      replicas: 1
      labels:
        io.pawtalk.managed: 'true'
        io.pawtalk.version: ${PAWTALK_RELEASE:?Set PAWTALK_RELEASE to the exact published image version}
      placement:
        constraints: [node.labels.pawtalk.data == true]
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
        monitor: 60s
      restart_policy:
        condition: any
        delay: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  host:
    external: true
    name: host
volumes:
  server_data:
    external: true
    name: ${PAWTALK_DATA_VOLUME:?Set the existing data volume name}
