# Linux Docker Engine is required for host networking and correct ICE addresses.
services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    network_mode: host
    restart: unless-stopped
    env_file: ./deploy/generated/api.env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  livekit:
    image: livekit/livekit-server:v1.13.11
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./deploy/generated/livekit.yaml:/etc/livekit.yaml:ro"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  proxy:
    image: caddy:2.11.7-alpine
    network_mode: host
    env_file: ./deploy/generated/proxy.env
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [api, livekit]
volumes:
  caddy_data:
  caddy_config:
