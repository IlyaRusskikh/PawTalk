# Standalone LAN stack for Docker Desktop (Linux containers) on Windows.
# Start through lan.cmd; do not combine with compose.yaml/compose.local.yaml.
name: pawtalk-lan
services:
  proxy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      SERVER_IP: ${SERVER_IP:?Run lan.cmd start first}
    ports: ["443:443/tcp"]
    volumes:
      - ./deploy/Caddyfile.lan:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [livekit]
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    # Keep the API private and preserve its loopback-only proxy-header trust.
    network_mode: service:proxy
    restart: unless-stopped
    env_file: ./deploy/generated/api.lan.env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [proxy]
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    ports: ["7881:7881/tcp", "7882:7882/udp"]
    volumes: ["./deploy/generated/livekit.lan.yaml:/etc/livekit.yaml:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  caddy_data:
  caddy_config:
