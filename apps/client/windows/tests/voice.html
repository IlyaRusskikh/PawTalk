<!doctype html><html><head><base href="/"/></head><body><script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { Participants } from '/src/Participants.tsx';
import CallScreenView from '/src/screen-share/CallScreenView.tsx';
import { applyTheme, defaultTheme } from '/src/theme.ts';
applyTheme(defaultTheme);
import '/src/style.css';
import '/src/interface.css';
import { VoiceSession } from '/src/session.ts';
import { defaults } from '/src/settings.ts';
import { changeLanguage } from '/src/i18n.ts';
window.changeLanguage=changeLanguage;
import { Track, LocalVideoTrack, Room } from 'livekit-client';
const cueTest = new URLSearchParams(location.search).has('cues');
window.roomCues=[];
if(cueTest){
 const gains=new WeakMap();const connect=AudioBufferSourceNode.prototype.connect;
 AudioBufferSourceNode.prototype.connect=function(destination,...args){if(destination instanceof GainNode)gains.set(this,destination);return connect.call(this,destination,...args);};
 const start=AudioBufferSourceNode.prototype.start;
 AudioBufferSourceNode.prototype.start=function(...args){
  const gain=gains.get(this),record={seconds:this.buffer.duration,energy:0,state:this.context.state,gain:gain?.gain.value};window.roomCues.push(record);
  if(gain){const analyser=this.context.createAnalyser();analyser.fftSize=2048;gain.connect(analyser);const data=new Float32Array(2048);let samples=0;const timer=setInterval(()=>{analyser.getFloatTimeDomainData(data);record.energy+=data.reduce((sum,x)=>sum+x*x,0);if(++samples===30){clearInterval(timer);try{gain.disconnect(analyser);}catch{}analyser.disconnect();}},10);}
  return start.apply(this,args);
 };
}
const c = new VoiceSession({ ...defaults, echoCancellation: false, noiseMode: new URLSearchParams(location.search).get('noise') === 'rnnoise' ? 'rnnoise' : 'off', autoGainControl: false, sounds: cueTest, autoSensitivity: false, threshold: -75, inputMode: 'ptt', pttReleaseMs: 0 });
window.voice = c;
let uiRoot;
const root = () => { if(!uiRoot){const el=document.createElement('div');el.style.padding='30px';document.body.append(el);uiRoot=createRoot(el);}return uiRoot;};
window.renderParticipants = () => {
 const people=window.snapshot.people;
 function Demo(){const [prefs,setPrefs]=React.useState({});return React.createElement('section',{className:'room-participants',style:{height:220}},React.createElement(Participants,{people,prefs,onChange:(id,volume,muted)=>{window.changedPref={id,volume,muted};c.setPerson(id,volume,muted);setPrefs(prev=>({...prev,[id]:{volume,muted}}));}}));}
 root().render(React.createElement(Demo));
};
window.snapshot = {};
let renderScreenCall;
c.onUpdate = value => { window.snapshot = value; renderScreenCall?.(); };
window.showScreenCall = visible => {
 renderScreenCall = visible ? () => root().render(React.createElement('div', { style: { height: 340 } },
  React.createElement(CallScreenView, { audioControls: null, deafened: c.deafened, onLeave() {},
   participantProps: { people: window.snapshot.people, prefs: {}, onChange() {} }, live: { session: c, snapshot: window.snapshot } }))) : undefined;
 if (renderScreenCall) renderScreenCall(); else root().render(null);
};
c.onError = message => { window.lastError = message; };
window.startScreenFixture = async () => {
 window.screenFixtureMinimized = false;
 const desktop = window.desktop;
 window.desktop = { duck: async () => {}, ...desktop, screenCaptureWindowStatus: async () => window.screenFixtureMinimized };
 const canvas = document.createElement('canvas');
 canvas.width = 480; canvas.height = 270;
 const paint = canvas.getContext('2d');
 let frame = 0;
 const draw = () => { paint.fillStyle = frame++ % 2 ? '#16814b' : '#12a052'; paint.fillRect(0,0,480,270); };
 draw();
 const timer = setInterval(draw,70);
 const audio = c.playback.createMediaStreamDestination();
 const tone = c.playback.createOscillator();
 tone.frequency.value = 440;
 const gain = c.playback.createGain(); gain.gain.value = .12;
 tone.connect(gain).connect(audio);
 tone.start();
 const stream = new MediaStream([...canvas.captureStream(15).getVideoTracks(), ...audio.stream.getAudioTracks()]);
 window.stopScreenFixture = async () => {
  try { await c.stopScreenShare(); } finally { clearInterval(timer); tone.stop(); window.desktop = desktop; }
 };
 try { await c.shareScreen(async () => stream, { source: 'window', requestedAudio: true }); }
 catch (error) { await window.stopScreenFixture(); throw error; }
};
window.start = async data => {
 if (data.voiceEpoch) {
  window.nextVoiceKey = undefined;
  window.nextVoiceGrant = undefined;
  window.grantRequests = 0;
  await c.connectProtected({
   join: async () => ({ ...data, key: data.e2eeKey, epoch: data.voiceEpoch }),
   refresh: async epochId => window.nextVoiceKey?.epochId !== epochId ? window.nextVoiceKey ?? null : null,
   reconnect: async () => { window.grantRequests++; return window.nextVoiceGrant; },
   leave: async () => {},
  });
 } else {
  await c.connect(data.url,data.token,{required:data.e2eeRequired,key:data.e2eeKey});
 }
 c.setMute(false,false); c.setPtt(true);
};
let decodedEnergy = 0;
const meters = new Map();
setInterval(() => {
 for (const [id,mixer] of c.mixers) {
  if (!meters.has(id)) {
   const source = c.playback.createMediaStreamSource(new MediaStream([mixer.track.mediaStreamTrack]));
   const analyser = c.playback.createAnalyser(); analyser.fftSize = 2048;
   source.connect(analyser); meters.set(id,{source,analyser,data:new Float32Array(2048),time:c.playback.currentTime});
  }
 }
 for(const [id,meter] of meters) {
  if(!c.mixers.has(id)) { meter.source.disconnect(); meter.analyser.disconnect(); meters.delete(id); continue; }
  const now=c.playback.currentTime;
  meter.analyser.getFloatTimeDomainData(meter.data);
  decodedEnergy += meter.data.reduce((sum,x)=>sum+x*x,0)/meter.data.length*(now-meter.time);
  meter.time=now;
 }
},20);
window.energy = async () => {
 let bytes = 0;
 for(const p of c.room?.remoteParticipants.values() || []) {
  const report = await p.getTrackPublication(Track.Source.Microphone)?.track?.getRTCStatsReport();
  report?.forEach(stat => { if(stat.type === 'inbound-rtp' && stat.kind === 'audio') bytes += stat.bytesReceived || 0; });
 }
 return {energy:decodedEnergy,bytes};
};
window.tryCamera = async () => {
 const canvas = document.createElement('canvas'); canvas.width=16; canvas.height=16;
 const stream = canvas.captureStream(1); const track = new LocalVideoTrack(stream.getVideoTracks()[0],undefined,true);
 try { await c.room.localParticipant.publishTrack(track,{source:Track.Source.Camera}); return false; }
 catch { return true; } finally { track.stop(); stream.getTracks().forEach(t=>t.stop()); }
};
window.tryToken = async data => {
 const room = new Room();
 try { await room.connect(data.url,data.token); return false; }
 catch { return true; } finally { await room.disconnect(); }
};
window.ready = true;
// Measure samples after the actual SDK playback gain, rather than RTP energy
// or just the slider value. Also verify the parallel HTML player is muted.
window.outputRMS = async () => {
 const mixer = [...c.mixers.values()][0];
 const analyser = c.playback.createAnalyser(); analyser.fftSize = 2048;
 const gain = mixer.track.gainNode;
 if (!gain || mixer.track.attachedElements.some(el => !el.muted)) throw new Error('Playback bypasses WebAudio');
 gain.connect(analyser);
 const data = new Float32Array(analyser.fftSize);
 let energy = 0;
 try {
  for(let i = 0; i < 30; i++) {
   await new Promise(resolve => setTimeout(resolve, 20));
   analyser.getFloatTimeDomainData(data);
   energy += data.reduce((sum,x) => sum+x*x,0) / data.length;
  }
  return Math.sqrt(energy / 30);
 } finally { gain.disconnect(analyser); analyser.disconnect(); }
};
// Compare both sides of the real playback gain in the same audio windows.
// Chromium's synthetic microphone is not stationary between separate samples.
window.outputGain = async () => {
 const mixer = [...c.mixers.values()][0];
 const gain = mixer.track.gainNode;
 const source = mixer.track.connectedNodes?.at(-2);
 if (!gain || !source || mixer.track.attachedElements.some(el => !el.muted)) throw new Error('Playback bypasses WebAudio');
 const input = c.playback.createAnalyser(), output = c.playback.createAnalyser();
 input.fftSize = output.fftSize = 2048;
 source.connect(input); gain.connect(output);
 const before = new Float32Array(2048), after = new Float32Array(2048);
 let inputEnergy = 0, outputEnergy = 0, lastTime = -1;
 try {
  const end = performance.now()+5000;
  for(let samples=0;samples<60 && performance.now()<end;) {
   await new Promise(resolve=>setTimeout(resolve,20));
   if(c.playback.currentTime===lastTime) continue;
   lastTime=c.playback.currentTime;
   input.getFloatTimeDomainData(before); output.getFloatTimeDomainData(after);
   inputEnergy += before.reduce((sum,x)=>sum+x*x,0);
   outputEnergy += after.reduce((sum,x)=>sum+x*x,0);
   samples++;
  }
  if(inputEnergy<0.001) throw new Error('No decoded audio during gain measurement');
  return Math.sqrt(outputEnergy/inputEnergy);
 } finally {source.disconnect(input);gain.disconnect(output);input.disconnect();output.disconnect();}
};
</script></body></html>
